<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 10px 0;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #0066cc;
            font-weight: bold;
            padding: 8px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        a:hover {
            background-color: #f0f0f0;
        }

        img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Welcome to My Portal</h1>
        <p>Connect with me across my social media channels below:</p>

        <ul>
            <li>
                <a href="https://www.facebook.com/daichii.11" target="_blank">
                    <img src="facebook.png" alt="Facebook Icon"> Facebook
                </a>
            </li>
            <li>
                <a href="https://github.com/20262890-hub" target="_blank">
                    <img src="github.png" alt="GitHub Icon"> GitHub
                </a>
            </li>
            <li>
                <a href="https://www.tiktok.com/@ddaixhi11" target="_blank">
                    <img src="tiktok.png" alt="TikTok Icon"> TikTok
                </a>
            </li>
            <li>
                <a href="https://www.instagram.com/breezyygabb/" target="_blank">
                    <img src="instagram.png" alt="Instagram Icon"> Instagram
                </a>
            </li>
        </ul>
    </div>

</body>
</html>
